<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contáctanos para resolver tus dudas sobre equipamiento, métodos de preparación o asesoramiento de barismo.">
    <title>Contacto | Tienda del Barista</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light-subtle text-dark d-flex flex-column min-vh-100">

    <a href="#contenido-principal" class="visually-hidden-focusable btn btn-success position-absolute top-0 start-0 m-3 z-3">
        Saltar al contenido principal
    </a>

    <!-- BARRA DE NAVEGACIÓN -->
    <header>
        <nav class="navbar navbar-expand-lg bg-success-subtle shadow-sm sticky-top" aria-label="Navegación principal">
            <div class="container">
                <a class="navbar-brand fw-bold text-success-emphasis" href="index.html">🌿 Tienda del Barista</a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Alternar menú de navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuNavegacion">
                    <ul class="navbar-nav ms-auto fw-semibold">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="categorias.html">Categorías</a></li>
                        <li class="nav-item"><a class="nav-link active text-success" aria-current="page" href="contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="contenido-principal" class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <section class="card shadow-sm border-0" aria-labelledby="titulo-contacto">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h1 id="titulo-contacto" class="h3 mb-0">Escríbenos</h1>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <p class="text-secondary mb-4 text-center">¿Tienes dudas sobre tu equipo? Completa el formulario y un barista te responderá a la brevedad.</p>
                        
                        <form action="#" method="post">
                            
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre completo <span class="text-danger" aria-hidden="true">*</span></label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: María Gómez" aria-required="true" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Correo electrónico <span class="text-danger" aria-hidden="true">*</span></label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="nombre@ejemplo.com" aria-required="true" required>
                            </div>

                            <div class="mb-3">
                                <label for="asunto" class="form-label fw-semibold">Asunto <span class="text-danger" aria-hidden="true">*</span></label>
                                <select class="form-select" id="asunto" name="asunto" aria-required="true" required>
                                    <option value="" disabled selected>Selecciona un motivo...</option>
                                    <option value="1">Consulta sobre producto</option>
                                    <option value="2">Problema con mi pedido</option>
                                    <option value="3">Ventas mayoristas</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="mensaje" class="form-label fw-semibold">Mensaje <span class="text-danger" aria-hidden="true">*</span></label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu consulta aquí..." aria-required="true" required></textarea>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success btn-lg">Enviar Mensaje</button>
                            </div>

                        </form>
                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-success text-light py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-1 fw-semibold">Tienda del Barista &copy; 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
